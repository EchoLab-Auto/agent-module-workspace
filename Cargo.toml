[workspace]
resolver = "2"
members = ["crates/agent-module-workspace"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/crate-workspace"

[workspace.dependencies]
# 框架仓（模块 trait / 挂载上下文）。与 EchoAgentCore 根 Cargo.toml 保持同一
# tag，避免同一进程里出现两份框架类型（Box<dyn Module> 不跨版本兼容）。
echo-module = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.4" }
echo-context = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.4" }
# 本机验证用（`cargo test` 前取消注释）：
# echo-module = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.2" }
# echo-context = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
# 面板 UI 贡献接缝（`PanelUiRegistrar`）住在 Core 的定义层 `echo-defs`：跨 crate
# 的服务键要求**同一个 trait 类型**（`Ctx::service` 的 downcast 认 vtable，
# 不认同名），所以模块必须依赖定义它的那个 crate。`rev` 与 Core 的引用同一个
# 提交——不同提交意味着两份 `dyn Trait`，注册会静默查不到。
echo-defs = { git = "https://github.com/EchoLab-Auto/EchoAgentCore", rev = "c59b4aee819a70768903d4914fe679f9999f0f54" }
